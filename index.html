<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>File Sharing Tool</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- JSZip CDN for ZIP creation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #030a03;
      --card-bg: #0a150a;
      --primary-green: #00ff66;
      --dark-green: #00220d;
      --border-green: #008833;
      --alert-red: #ff3333;
      --text-dim: #00cc55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg-color);
      color: var(--primary-green);
    }

    /* Initial State: Screen Center Alignment */
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      padding-top: 25vh; /* Centered initial layout */
      overflow-x: hidden;
      transition: padding-top 0.3s ease;
    }

    /* Active State when Connected: Fits from Top */
    body.is-connected {
      padding-top: 12px !important;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 1px solid var(--primary-green);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
    }

    h1 {
      text-align: center;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      margin-bottom: 15px;
      border-bottom: 1px dashed var(--primary-green);
      padding-bottom: 10px;
      word-break: break-word;
      letter-spacing: 1px;
    }

    .status-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #051505;
      padding: 10px 14px;
      border: 1px solid var(--primary-green);
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .code-box {
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      margin-left: 6px;
      vertical-align: middle;
    }

    .timer-box {
      font-size: 0.85rem;
      font-weight: bold;
      color: #ffffff;
      background: #000;
      padding: 4px 8px;
      border: 1px solid var(--primary-green);
      border-radius: 4px;
      display: none;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #000;
      border: 1px solid var(--primary-green);
      color: var(--primary-green);
      padding: 10px;
      font-size: 0.95rem;
      outline: none;
      text-align: center;
      border-radius: 4px;
    }

    button {
      background: var(--dark-green);
      color: var(--primary-green);
      border: 1px solid var(--primary-green);
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #003d18;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.btn-red {
      border-color: var(--alert-red);
      color: var(--alert-red);
      background: #200;
    }

    button.btn-red:hover {
      background: var(--alert-red);
      color: #fff;
    }

    .error-msg {
      color: var(--alert-red);
      font-size: 0.8rem;
      text-align: center;
      margin-bottom: 10px;
      display: none;
      word-break: break-word;
    }

    .workspace {
      display: none;
      margin-top: 15px;
    }

    .connection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #000;
      padding: 10px;
      border: 1px solid var(--primary-green);
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .file-input-wrapper {
      margin-bottom: 15px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--primary-green);
      background: #000;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      color: var(--primary-green);
      transition: background 0.2s;
    }

    .custom-file-btn:hover {
      background: var(--dark-green);
    }

    .custom-file-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--primary-green);
    }

    .file-canvas-box {
      margin: 10px 0;
      background: #000;
      border: 1px dashed var(--border-green);
      border-radius: 5px;
      padding: 8px;
      min-height: 50px;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
    }

    .selected-file-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-dim);
      padding: 3px 0;
      border-bottom: 1px dotted #003311;
    }

    .selected-file-row:last-child {
      border-bottom: none;
    }

    .remove-file-btn {
      background: transparent;
      color: var(--alert-red);
      border: 1px solid var(--alert-red);
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1.2;
    }

    .remove-file-btn:hover {
      background: var(--alert-red);
      color: #fff;
    }

    .dual-boxes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 15px;
      width: 100%;
    }

    @media (max-width: 640px) {
      .dual-boxes {
        grid-template-columns: 1fr;
      }
      .box-panel {
        height: 220px !important;
      }
    }

    .box-panel {
      background: #000;
      border: 1px solid var(--border-green);
      border-radius: 5px;
      padding: 12px;
      height: 240px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-green);
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .box-panel h3 {
      font-size: 0.85rem;
      color: var(--primary-green);
    }

    .box-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-width: 0;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--dark-green);
      padding: 6px 10px;
      border: 1px solid var(--border-green);
      margin-bottom: 6px;
      font-size: 0.78rem;
      border-radius: 3px;
      min-width: 0;
      width: 100%;
    }

    .file-name-text {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download-btn, .file-status-tag {
      color: var(--primary-green);
      text-decoration: none;
      border: 1px solid var(--primary-green);
      padding: 3px 6px;
      border-radius: 3px;
      flex-shrink: 0;
      font-size: 0.72rem;
      cursor: pointer;
      background: transparent;
    }

    .download-btn:hover {
      background: var(--primary-green);
      color: #000;
    }

    .download-btn.downloaded {
      color: #008844;
      border-color: #008844;
      background: #001a08;
    }

    .progress-container {
      margin-top: 12px;
      padding: 10px;
      background: #000;
      border: 1px dashed var(--primary-green);
      border-radius: 4px;
      display: none;
    }

    .spinner {
      border: 3px solid var(--dark-green);
      border-top: 3px solid var(--primary-green);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 6px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #051005;
      border: 1px solid var(--primary-green);
      margin-top: 6px;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary-green);
      transition: width 0.1s;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>File Sharing Tool</h1>

    <!-- HEADER PANEL FOR YOUR CODE -->
    <div class="status-panel">
      <div style="color: #ffffff;">
        YOUR CODE: <span id="myCode" class="code-box">GENERATING...</span>
        <button class="btn-sm" onclick="refreshMyCode()">REFRESH</button>
      </div>
      <div id="statusText">[INITIALIZING...]</div>
    </div>

    <!-- Connection Input Block -->
    <div id="connectForm">
      <div class="input-group">
        <input type="text" id="targetCode" placeholder="ENTER 4-DIGIT CODE" maxlength="4" disabled>
        <button id="connectBtn" onclick="connectToPeer()" disabled>CONNECT</button>
      </div>
      <div id="errorMsg" class="error-msg">> ERROR: CONNECTION FAILED!</div>
    </div>

    <!-- Connected Active Workspace -->
    <div id="workspace" class="workspace">
      <div class="connection-header">
        <div>
          <span style="color: var(--primary-green); font-weight: bold; font-size: 0.85rem;">[CONNECTED]</span>
          <span id="connectedInfo" style="margin-left: 6px; color: #fff; font-size: 0.85rem;">----</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div id="sessionTimer" class="timer-box">00:00:00</div>
          <button class="btn-red" onclick="disconnectPeer()">DISCONNECT</button>
        </div>
      </div>

      <div class="file-input-wrapper">
        <label for="fileInput" class="custom-file-btn">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          SELECT FILES
        </label>
        <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">

        <!-- CANVAS BOX FOR SELECTED FILE LIST -->
        <div id="fileCanvasBox" class="file-canvas-box">
          <div style="color: #006622;">> No files selected...</div>
        </div>

        <button id="sendBtn" onclick="handleSendOrCancel()" style="width: 100%;">SEND FILES</button>
      </div>

      <!-- Upload/Sending Progress Spinner -->
      <div id="progressContainer" class="progress-container">
        <div class="spinner"></div>
        <div id="progressText" style="text-align: center; font-size: 0.8rem;">SENDING: 0%</div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Dual File Transfer History Boxes -->
      <div class="dual-boxes">
        <!-- Sent Files Panel -->
        <div class="box-panel">
          <div class="box-header">
            <h3>> SENT FILES</h3>
          </div>
          <div id="sentFilesBox" class="box-content">
            <p style="font-size: 0.75rem; color: var(--text-dim);">No files sent yet...</p>
          </div>
        </div>

        <!-- Received Files Panel -->
        <div class="box-panel">
          <div class="box-header">
            <h3>> RECEIVED FILES</h3>
            <button id="downloadAllBtn" class="btn-sm" onclick="downloadAllFilesAsZip()">DOWNLOAD ALL (ZIP)</button>
          </div>
          <div id="receivedFilesBox" class="box-content">
            <p style="font-size: 0.75rem; color: var(--text-dim);">No files received yet...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let mySessionCode = Math.floor(1000 + Math.random() * 9000).toString();

    let timerInterval = null;
    let connectTimeout = null;
    let totalSeconds = 0;
    let isSending = false;
    let cancelRequested = false;

    let selectedFiles = [];
    let receivedBlobsMap = new Map();

    const myCodeBox = document.getElementById('myCode');
    const statusText = document.getElementById('statusText');
    const connectBtn = document.getElementById('connectBtn');
    const targetInput = document.getElementById('targetCode');

    initPeer();

    function initPeer() {
      peer = new Peer(`hacker-share-${mySessionCode}`);

      peer.on('open', (id) => {
        myCodeBox.innerText = mySessionCode;
        statusText.innerText = '[READY TO PAIR]';
        statusText.style.color = 'var(--primary-green)';

        targetInput.disabled = false;
        connectBtn.disabled = false;
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupConnectionEvents();
      });

      peer.on('error', (err) => {
        resetConnectButton();
        if (err.type === 'unavailable-id') {
          mySessionCode = Math.floor(1000 + Math.random() * 9000).toString();
          initPeer();
        } else {
          showError("NETWORK ERROR: " + err.type);
        }
      });
    }

    function refreshMyCode() {
      if (conn) {
        showError("DISCONNECT BEFORE REFRESHING CODE!");
        return;
      }
      if (peer) {
        peer.destroy();
      }
      myCodeBox.innerText = "GENERATING...";
      statusText.innerText = '[INITIALIZING...]';
      targetInput.disabled = true;
      connectBtn.disabled = true;

      mySessionCode = Math.floor(1000 + Math.random() * 9000).toString();
      initPeer();
    }

    function resetConnectButton() {
      if (connectTimeout) clearTimeout(connectTimeout);
      connectBtn.innerText = "CONNECT";
      connectBtn.disabled = false;
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.innerText = '> ' + msg;
      err.style.display = 'block';
      setTimeout(() => { err.style.display = 'none'; }, 4000);
    }

    function connectToPeer() {
      const targetCode = targetInput.value.trim();

      if (targetCode.length !== 4 || isNaN(targetCode)) {
        showError("ENTER A VALID 4-DIGIT CODE!");
        return;
      }
      if (targetCode === mySessionCode) {
        showError("CANNOT PAIR WITH YOUR OWN CODE!");
        return;
      }

      connectBtn.innerText = "CONNECTING...";
      connectBtn.disabled = true;

      connectTimeout = setTimeout(() => {
        if (!conn || !conn.open) {
          showError("CONNECTION TIMED OUT / INVALID CODE!");
          resetConnectButton();
          if (conn) conn.close();
        }
      }, 7000);

      conn = peer.connect(`hacker-share-${targetCode}`);
      setupConnectionEvents();
    }

    function setupConnectionEvents() {
      conn.on('open', () => {
        if (connectTimeout) clearTimeout(connectTimeout);

        document.getElementById('connectForm').style.display = 'none';
        document.getElementById('workspace').style.display = 'block';

        // Add class to shift UI to full top fit upon connection
        document.body.classList.add('is-connected');

        const otherCode = conn.peer.replace('hacker-share-', '');
        document.getElementById('connectedInfo').innerText = `PEER: ${otherCode}`;
        statusText.innerText = '[CONNECTED]';
        statusText.style.color = '#00ff66';

        startTimer();
      });

      conn.on('data', (data) => {
        renderReceivedFile(data);
      });

      conn.on('close', () => {
        disconnectPeer();
      });

      conn.on('error', (err) => {
        showError("PEER CONNECTION FAILED!");
        resetConnectButton();
        disconnectPeer();
      });
    }

    function startTimer() {
      totalSeconds = 0;
      const timerDisplay = document.getElementById('sessionTimer');
      timerDisplay.style.display = 'block';

      timerInterval = setInterval(() => {
        totalSeconds++;
        const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      const timerDisplay = document.getElementById('sessionTimer');
      timerDisplay.style.display = 'none';
      timerDisplay.innerText = '00:00:00';
    }

    function disconnectPeer() {
      if (conn) {
        conn.close();
      }
      conn = null;
      stopTimer();
      resetConnectButton();

      // Remove class to restore centered alignment
      document.body.classList.remove('is-connected');

      document.getElementById('connectForm').style.display = 'block';
      document.getElementById('workspace').style.display = 'none';
      statusText.innerText = '[READY TO PAIR]';
      statusText.style.color = 'var(--primary-green)';
      targetInput.value = '';
    }

    function handleFileSelect(event) {
      const files = Array.from(event.target.files);
      selectedFiles = selectedFiles.concat(files);
      renderSelectedFiles();
      event.target.value = '';
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderSelectedFiles();
    }

    function renderSelectedFiles() {
      const box = document.getElementById('fileCanvasBox');
      box.innerHTML = '';
      if (selectedFiles.length === 0) {
        box.innerHTML = '<div style="color: #006622;">> No files selected...</div>';
        return;
      }
      selectedFiles.forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'selected-file-row';
        row.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:8px;">
            > ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB)
          </span>
          <button class="remove-file-btn" onclick="removeFile(${index})" title="Remove file">✕</button>
        `;
        box.appendChild(row);
      });
    }

    function handleSendOrCancel() {
      if (isSending) {
        cancelRequested = true;
        const progressText = document.getElementById('progressText');
        progressText.innerText = "CANCELING...";
      } else {
        sendFiles();
      }
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function sendFiles() {
      if (!selectedFiles.length) {
        alert("Select at least one file!");
        return;
      }

      const files = [...selectedFiles];
      const progressContainer = document.getElementById('progressContainer');
      const progressText = document.getElementById('progressText');
      const progressBarFill = document.getElementById('progressBarFill');
      const sendBtn = document.getElementById('sendBtn');

      isSending = true;
      cancelRequested = false;

      sendBtn.innerText = "CANCEL SENDING";
      sendBtn.classList.add('btn-red');
      progressContainer.style.display = 'block';

      const CHUNK_SIZE = 16 * 1024;

      for (let i = 0; i < files.length; i++) {
        if (cancelRequested) break;

        const file = files[i];
        const arrayBuffer = await file.arrayBuffer();
        const totalChunks = Math.ceil(arrayBuffer.byteLength / CHUNK_SIZE);

        for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
          if (cancelRequested) break;

          const start = chunkIndex * CHUNK_SIZE;
          const end = Math.min(arrayBuffer.byteLength, start + CHUNK_SIZE);
          const chunk = arrayBuffer.slice(start, end);

          let fileProgress = ((chunkIndex + 1) / totalChunks) * 100;
          let overallProgress = Math.round(((i + (fileProgress / 100)) / files.length) * 100);

          progressText.innerText = `SENDING (${i + 1}/${files.length}): ${overallProgress}%`;
          progressBarFill.style.width = overallProgress + '%';

          conn.send({
            type: 'file-chunk',
            name: file.name,
            mime: file.type,
            size: file.size,
            chunkIndex: chunkIndex,
            totalChunks: totalChunks,
            buffer: chunk
          });

          await sleep(5);
        }

        if (!cancelRequested) {
          renderSentFile(file.name, (file.size / (1024*1024)).toFixed(2));
        }
      }

      if (cancelRequested) {
        progressText.innerText = "SENDING CANCELLED!";
        progressBarFill.style.width = '0%';
      } else {
        progressText.innerText = `SENDING COMPLETE: 100%`;
        progressBarFill.style.width = '100%';
      }

      setTimeout(() => {
        progressContainer.style.display = 'none';
        isSending = false;
        cancelRequested = false;

        sendBtn.innerText = "SEND FILES";
        sendBtn.classList.remove('btn-red');

        selectedFiles = [];
        renderSelectedFiles();
      }, 1200);
    }

    function renderSentFile(fileName, sizeMB) {
      const box = document.getElementById('sentFilesBox');
      if (box.querySelector('p')) box.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="file-name-text" title="${fileName}">> ${fileName} (${sizeMB} MB)</span>
        <span class="file-status-tag">[SENT]</span>
      `;
      box.appendChild(item);
    }

    let incomingFiles = {};

    function renderReceivedFile(data) {
      if (data && data.type === 'file-chunk') {
        const fileKey = data.name + '_' + data.size;

        if (!incomingFiles[fileKey]) {
          incomingFiles[fileKey] = {
            name: data.name,
            mime: data.mime,
            size: data.size,
            chunks: new Array(data.totalChunks),
            receivedCount: 0
          };
        }

        incomingFiles[fileKey].chunks[data.chunkIndex] = data.buffer;
        incomingFiles[fileKey].receivedCount++;

        if (incomingFiles[fileKey].receivedCount === data.totalChunks) {
          const completeBlob = new Blob(incomingFiles[fileKey].chunks, { type: data.mime || 'application/octet-stream' });
          const downloadUrl = URL.createObjectURL(completeBlob);

          receivedBlobsMap.set(data.name, completeBlob);

          const box = document.getElementById('receivedFilesBox');
          if (box.querySelector('p')) box.innerHTML = '';

          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `
            <span class="file-name-text" title="${data.name}">> ${data.name}</span>
            <a href="${downloadUrl}" download="${data.name}" class="download-btn" onclick="markDownloaded(this)">DOWNLOAD</a>
          `;
          box.appendChild(item);

          delete incomingFiles[fileKey];
        }
      }
    }

    function markDownloaded(element) {
      element.innerText = "DOWNLOADED";
      element.classList.add("downloaded");
    }

    async function downloadAllFilesAsZip() {
      if (receivedBlobsMap.size === 0) {
        alert("No received files to download!");
        return;
      }

      const zipBtn = document.getElementById('downloadAllBtn');
      const originalText = zipBtn.innerText;
      zipBtn.innerText = "ZIPPING...";
      zipBtn.disabled = true;

      try {
        const zip = new JSZip();

        receivedBlobsMap.forEach((blob, filename) => {
          zip.file(filename, blob);
        });

        const zipBlob = await zip.generateAsync({ type: "blob" });
        const zipUrl = URL.createObjectURL(zipBlob);

        const a = document.createElement('a');
        a.href = zipUrl;
        a.download = "Bundle_Files.zip";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        document.querySelectorAll('#receivedFilesBox .download-btn').forEach(btn => markDownloaded(btn));

      } catch (err) {
        alert("Failed to create ZIP: " + err.message);
      } finally {
        zipBtn.innerText = originalText;
        zipBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
